<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANTALE — Classements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Cinzel+Decorative:wght@400;700;900&family=Unbounded:wght@200;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .lb-hero{padding:140px 20px 40px;text-align:center}
  .lb-title{font-family:var(--ff-title);font-size:clamp(40px,6vw,72px);font-weight:900;color:var(--cream);letter-spacing:.04em}
  .lb-title span{color:var(--red3)}

  .lb-grid{max-width:1300px;margin:60px auto 100px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
  .lb-card{background:var(--bg2);padding:28px;border-top:3px solid var(--red2)}
  .lb-card h3{font-family:var(--ff-title);font-size:24px;color:var(--cream);margin-bottom:20px;letter-spacing:.04em}
  .lb-row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);align-items:center}
  .lb-row:last-child{border-bottom:none}
  .lb-rank{font-family:var(--ff-title);font-size:18px;font-weight:900;color:var(--dim)}
  .lb-rank.r1{color:#f0b84a}
  .lb-rank.r2{color:#bbb}
  .lb-rank.r3{color:#cd7f32}
  .lb-name{font-family:var(--ff-mono);font-size:13px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-value{font-family:var(--ff-mono);font-size:13px;color:var(--red3);font-weight:500;text-align:right}
  .empty{font-family:var(--ff-mono);color:var(--dim);text-align:center;padding:24px}
  .loading{text-align:center;padding:60px;font-family:var(--ff-mono);color:var(--dim);grid-column:1/-1}
</style>
</head>
<body>

<div class="noise"></div>
<canvas id="canvas-bg"></canvas>

<nav>
  <a href="index.html" class="nav-logo">CANT<b>A</b>LE</a>
  <ul class="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="factions.html">Factions</a></li>
    <li><a href="leaderboards.html">Classements</a></li>
    <li><a href="liste.html">Liste</a></li>
    <li><a href="regles.html">Règlement</a></li>
  </ul>
  <span data-cantale-user class="nav-btn" style="background:transparent;border:1px solid var(--red2);padding:10px 18px">…</span>
</nav>

<section class="lb-hero">
  <h1 class="lb-title">LES <span>CLASSEMENTS</span></h1>
</section>

<div id="grid" class="lb-grid">
  <div class="loading">Chargement…</div>
</div>

<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
const LABELS = {
  kills: { title: '⚔️ Tueurs', unit: 'kills' },
  deaths: { title: '💀 Morts', unit: 'morts' },
  balance: { title: '💰 Plus riches', unit: 'Cantox' },
  kill_streak: { title: '🔥 Killstreaks', unit: 'streak' },
  votes: { title: '🗳️ Votants', unit: 'votes' },
  factions: { title: '🏰 Factions', unit: 'power' },
};

function fmtNum(n) { return n.toLocaleString('fr-FR'); }

function renderCard(type, entries) {
  const meta = LABELS[type];
  const rows = entries.length === 0
    ? '<div class="empty">Aucune donnée encore</div>'
    : entries.map((e) => {
        const rankCls = e.rank <= 3 ? ` r${e.rank}` : '';
        const medal = e.rank === 1 ? '①' : e.rank === 2 ? '②' : e.rank === 3 ? '③' : `${e.rank}.`;
        return `
          <div class="lb-row">
            <div class="lb-rank${rankCls}">${medal}</div>
            <div class="lb-name">${e.username}</div>
            <div class="lb-value">${fmtNum(Math.floor(e.value))} ${meta.unit}</div>
          </div>
        `;
      }).join('');
  return `<div class="lb-card"><h3>${meta.title}</h3>${rows}</div>`;
}

(async () => {
  let all;
  try { all = await CantaleAPI.allLeaderboards(); }
  catch (e) {
    document.getElementById('grid').innerHTML = `<div class="loading" style="color:#f44">Erreur : ${e.message}</div>`;
    return;
  }
  document.getElementById('grid').innerHTML = Object.keys(LABELS).map(type => renderCard(type, all[type] || [])).join('');
})();
</script>
<script src="scripts.js" defer></script>
</body>
</html>
