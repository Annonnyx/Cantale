<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANTALE — Factions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Cinzel+Decorative:wght@400;700;900&family=Unbounded:wght@200;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .factions-hero{padding:140px 20px 40px;text-align:center}
  .factions-title{font-family:var(--ff-title);font-size:clamp(40px,6vw,72px);font-weight:900;color:var(--cream);letter-spacing:.04em}
  .factions-title span{color:var(--red3)}
  .factions-sub{font-family:var(--ff-mono);font-size:13px;color:var(--dim);margin-top:16px}

  .factions-grid{max-width:1300px;margin:60px auto 100px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .faction-tile{
    background:var(--bg2);padding:24px;cursor:pointer;
    border-top:3px solid var(--red2);transition:transform .15s,box-shadow .15s;
    text-decoration:none;color:inherit;display:block;
  }
  .faction-tile:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .faction-tile.empire{border-top-color:#f0b84a}
  .faction-tile.country{border-top-color:#4fc3f7}
  .faction-tag{font-family:var(--ff-mono);font-size:11px;letter-spacing:.25em;color:var(--red3);margin-bottom:10px}
  .faction-name{font-family:var(--ff-title);font-size:28px;font-weight:900;color:var(--cream);line-height:1.1}
  .faction-meta{display:flex;justify-content:space-between;margin-top:16px;font-family:var(--ff-mono);font-size:11px;color:var(--dim)}
  .faction-power{margin-top:12px;font-family:var(--ff-mono);font-size:12px;color:var(--cream)}
  .faction-power strong{color:#f0b84a;font-size:18px}

  .badge{display:inline-block;padding:2px 8px;font-size:10px;letter-spacing:.15em;margin-left:6px}
  .badge-empire{background:#f0b84a;color:#000}
  .badge-country{background:#4fc3f7;color:#000}

  .loading{text-align:center;padding:60px;font-family:var(--ff-mono);color:var(--dim)}
</style>
</head>
<body>

<div class="noise"></div>
<canvas id="canvas-bg"></canvas>

<nav>
  <a href="index.html" class="nav-logo">CANT<b>A</b>LE</a>
  <ul class="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="#" class="shop-disabled" title="Boutique temporairement fermée">Boutique</a></li>
    <li><a href="palliers.html">Palliers</a></li>
    <li><a href="liste.html">Liste</a></li>
    <li><a href="regles.html">Règlement</a></li>
  </ul>
  <span data-cantale-user class="nav-btn" style="background:transparent;border:1px solid var(--red2);padding:10px 18px">…</span>
</nav>

<section class="factions-hero">
  <h1 class="factions-title">LES <span>FACTIONS</span></h1>
  <p class="factions-sub">Toutes les factions actives de Cantale, classées par puissance.</p>
</section>

<div id="grid" class="factions-grid">
  <div class="loading" style="grid-column:1/-1">Chargement des factions…</div>
</div>

<script src="config.js"></script>
<script src="api-client.js"></script>
<script>
function fmtNum(n) { return n.toLocaleString('fr-FR'); }

(async () => {
  let data;
  try { data = await CantaleAPI.listFactions(); }
  catch (e) {
    document.getElementById('grid').innerHTML = `<div class="loading" style="grid-column:1/-1;color:#f44">Erreur : ${e.message}</div>`;
    return;
  }
  const grid = document.getElementById('grid');
  if (data.factions.length === 0) {
    grid.innerHTML = '<div class="loading" style="grid-column:1/-1">Aucune faction encore. Sois le premier ! <code>/f create &lt;nom&gt;</code></div>';
    return;
  }
  grid.innerHTML = data.factions.map(f => {
    const tierBadge = f.type === 'empire' ? '<span class="badge badge-empire">EMPIRE</span>'
                    : f.type === 'country' ? '<span class="badge badge-country">PAYS</span>' : '';
    const tileClass = f.type === 'empire' ? 'empire' : f.type === 'country' ? 'country' : '';
    return `
      <a class="faction-tile ${tileClass}" href="faction.html?tag=${encodeURIComponent(f.tag)}">
        <div class="faction-tag">[${f.tag}]</div>
        <div class="faction-name">${f.name}${tierBadge}</div>
        <div class="faction-meta">
          <span>👥 ${fmtNum(f.memberCount)} membres</span>
          <span>🗺️ ${fmtNum(f.claimCount)} claims</span>
        </div>
        <div class="faction-power">Pouvoir : <strong>${fmtNum(f.power)}</strong></div>
      </a>
    `;
  }).join('');
})();
</script>
<script src="scripts.js" defer></script>
</body>
</html>
