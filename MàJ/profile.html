<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANTALE — Mon profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0A; --paper:#F5F4F0; --gris:#8A8A8A;
  --bt:6px solid #0A0A0A; --bm:3px solid #0A0A0A; --bs:2px solid #0A0A0A;
  --bt-i:6px solid #F5F4F0; --bm-i:3px solid #F5F4F0; --bs-i:2px solid #F5F4F0;
  --fd:'Anton','Arial Narrow',sans-serif;
  --fw:'Unbounded','Anton',sans-serif;
  --fb:'Inter',sans-serif;
  --fm:'JetBrains Mono',monospace;
  --e:.15s ease;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--fb);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;}
.w{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,56px);}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--ink);color:var(--paper);border-bottom:var(--bt);}
.ni{display:flex;align-items:center;justify-content:space-between;height:66px;}
.nl{display:flex;gap:4px;align-items:center;}
.nb{font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:8px 13px;background:transparent;color:var(--paper);border:2px solid transparent;transition:border-color var(--e);}
.nb:hover{border-color:var(--paper);}
.nshop{font-family:var(--fm);font-size:12px;font-weight:700;padding:9px 16px;background:var(--paper);color:var(--ink);border:2px solid var(--paper);transition:background var(--e),color var(--e);}
.nshop:hover{background:transparent;color:var(--paper);}
.nmob{display:none;background:none;border:2px solid var(--paper);color:var(--paper);width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer;}

/* PROFILE HERO */
.profile-hero{padding-top:66px;background:var(--ink);color:var(--paper);border-bottom:var(--bt);}
.profile-hero-inner{display:grid;grid-template-columns:auto 1fr;gap:0;align-items:stretch;}
.avatar-cell{padding:clamp(28px,4vw,56px);border-right:var(--bt-i);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-width:clamp(160px,20vw,240px);}
.avatar-img{width:clamp(80px,10vw,128px);height:clamp(80px,10vw,128px);image-rendering:pixelated;border:var(--bt-i);}
.avatar-rank{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:4px 10px;border:2px solid rgba(245,244,240,.4);text-align:center;}
.avatar-rank.rank-CHEVRE{border-color:#D4A017;color:#D4A017;}
.avatar-rank.rank-VIP{border-color:#F5F4F0;color:#F5F4F0;background:rgba(245,244,240,.12);}
.avatar-rank.rank-AVENTURIER{border-color:#4fc3f7;color:#4fc3f7;}

.profile-info{padding:clamp(28px,4vw,56px);}
.profile-kicker{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.4;margin-bottom:10px;}
.profile-name{font-family:var(--fw);font-weight:900;font-size:clamp(36px,7vw,88px);line-height:.9;letter-spacing:-0.02em;text-transform:uppercase;margin-bottom:16px;}
.lives-row{display:flex;align-items:center;gap:10px;}
.life-hex{width:32px;height:32px;}

/* STATS GRID */
.stats-section{border-bottom:var(--bt);}
.stats-grid{display:grid;grid-template-columns:repeat(6,1fr);}
.stat-cell{padding:24px 16px;border-right:var(--bs);text-align:center;display:flex;flex-direction:column;gap:6px;}
.stat-cell:last-child{border-right:none;}
.stat-val{font-family:var(--fd);font-size:clamp(24px,3.5vw,44px);line-height:1;}
.stat-lbl{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.4;}

/* SECTIONS */
.profile-body{padding:clamp(32px,4vw,56px) 0;}
.psec{margin-bottom:clamp(32px,4vw,52px);}
.psec-title{font-family:var(--fd);font-size:clamp(18px,2.5vw,28px);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.psec-title::before{content:'';width:18px;height:5px;background:var(--ink);}

/* FACTION CARD */
.faction-card{border:var(--bt);display:grid;grid-template-columns:auto 1fr auto;align-items:center;}
.faction-tag-cell{background:var(--ink);color:var(--paper);padding:20px 24px;border-right:var(--bt);display:flex;align-items:center;justify-content:center;}
.faction-tag-txt{font-family:var(--fd);font-size:clamp(20px,2.5vw,32px);text-transform:uppercase;}
.faction-info{padding:20px 28px;display:flex;flex-direction:column;gap:6px;}
.faction-name{font-family:var(--fd);font-size:clamp(20px,2.5vw,32px);text-transform:uppercase;line-height:1;}
.faction-meta{font-family:var(--fm);font-size:11px;opacity:.5;letter-spacing:.06em;}
.faction-link{padding:20px 24px;border-left:var(--bt);}
.faction-link a{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.faction-link a:hover{text-decoration:underline;}

.faction-empty{border:var(--bm);padding:28px 24px;font-family:var(--fm);font-size:13px;opacity:.5;display:flex;align-items:center;gap:16px;}
.faction-empty code{font-family:var(--fm);font-weight:700;background:rgba(10,10,10,.08);padding:3px 8px;}

/* VOTES CARD */
.votes-card{border:var(--bt);display:grid;grid-template-columns:repeat(3,1fr);}
.vote-cell{padding:24px 20px;border-right:var(--bs);text-align:center;display:flex;flex-direction:column;gap:6px;}
.vote-cell:last-child{border-right:none;}
.vote-val{font-family:var(--fd);font-size:clamp(28px,4vw,48px);line-height:1;}
.vote-lbl{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.4;}

/* LOGOUT */
.logout-row{border-top:var(--bs);padding-top:28px;margin-top:clamp(24px,3vw,40px);display:flex;justify-content:flex-end;}
.logout-btn{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:11px 22px;background:transparent;color:var(--gris);border:2px solid rgba(138,138,138,.35);transition:color var(--e),border-color var(--e);}
.logout-btn:hover{color:var(--ink);border-color:var(--ink);}

/* LOADING */
.loading{min-height:60vh;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:13px;opacity:.4;padding-top:66px;}

/* FOOTER */
footer.bot{border-top:var(--bt);padding:26px 0;}
.frow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.flinks{display:flex;gap:18px;flex-wrap:wrap;}
.flinks a{font-family:var(--fm);font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.55;transition:opacity var(--e);}
.flinks a:hover{opacity:1;text-decoration:underline;}
.fcopy{font-family:var(--fm);font-size:11px;opacity:.32;}

@media(max-width:960px){
  .nl{display:none;} .nmob{display:flex;}
  .profile-hero-inner{grid-template-columns:1fr;}
  .avatar-cell{border-right:none;border-bottom:var(--bt-i);flex-direction:row;justify-content:flex-start;padding:24px clamp(16px,4vw,56px);}
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .stat-cell:nth-child(3){border-right:none;}
  .stat-cell:nth-child(n+4){border-top:var(--bs);}
  .faction-card{grid-template-columns:auto 1fr;}
  .faction-link{display:none;}
}
@media(max-width:560px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .stat-cell:nth-child(2n){border-right:none;}
  .stat-cell:nth-child(2n+1){border-right:var(--bs);}
  .stat-cell:nth-child(n+3){border-top:var(--bs);}
  .votes-card{grid-template-columns:1fr;}
  .vote-cell{border-right:none;border-bottom:var(--bs);}
  .vote-cell:last-child{border-bottom:none;}
}
</style>
</head>
<body>

<template id="logo-tpl">
<svg viewBox="0 0 340 44" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#F5F4F0" stroke-width="4.5">
    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#F5F4F0"/>
    <polygon points="60,2 76,11 76,29 60,38 44,29 44,11"/>
    <polygon points="100,2 116,11 116,29 100,38 84,29 84,11"/>
    <line x1="90" y1="13" x2="110" y2="27"/><line x1="110" y1="13" x2="90" y2="27"/>
  </g>
  <text x="132" y="28" font-family="Unbounded,Anton,sans-serif" font-weight="800" font-size="22" fill="#F5F4F0" letter-spacing="-0.5">CANTALE</text>
</svg>
</template>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="hx-full"  viewBox="0 0 96 96"><polygon points="48,4 89,27 89,73 48,96 7,73 7,27" fill="currentColor"/></symbol>
    <symbol id="hx-empty" viewBox="0 0 96 96"><polygon points="48,4 89,27 89,73 48,96 7,73 7,27" fill="none" stroke="currentColor" stroke-width="8"/></symbol>
    <symbol id="hx-dead"  viewBox="0 0 96 96"><polygon points="48,4 89,27 89,73 48,96 7,73 7,27" fill="none" stroke="currentColor" stroke-width="8"/><line x1="22" y1="22" x2="74" y2="74" stroke="currentColor" stroke-width="8"/><line x1="74" y1="22" x2="22" y2="74" stroke="currentColor" stroke-width="8"/></symbol>
  </defs>
</svg>

<header>
  <div class="w ni">
    <div id="logoWrap"></div>
    <nav class="nl">
      <a class="nb" href="index.html">Accueil</a>
      <a class="nb" href="factions.html">Factions</a>
      <a class="nb" href="palliers.html">Paliers</a>
      <a class="nb" href="liste.html">Liste des morts</a>
      <a class="nb" href="regles.html">Règles</a>
      <a class="nshop" href="boutique.html">Boutique</a>
    </nav>
    <button class="nmob" id="mobBtn" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
</header>

<div id="mobMenu" style="display:none;position:fixed;top:66px;left:0;right:0;z-index:199;background:var(--ink);border-bottom:var(--bt);padding:12px 0;">
  <div class="w" style="display:flex;flex-direction:column;gap:2px;">
    <a class="nb" style="text-align:left;" href="index.html">Accueil</a>
    <a class="nb" style="text-align:left;" href="factions.html">Factions</a>
    <a class="nb" style="text-align:left;" href="palliers.html">Paliers</a>
    <a class="nb" style="text-align:left;" href="liste.html">Liste des morts</a>
    <a class="nb" style="text-align:left;" href="regles.html">Règles</a>
    <a class="nb" style="text-align:left;" href="boutique.html">Boutique</a>
  </div>
</div>

<div id="page-content">
  <div class="loading">Chargement du profil…</div>
</div>

<script src="config.js"></script>
<script src="api-client.js"></script>
<script>
(function(){
  const tpl = document.getElementById('logo-tpl');
  const wrap = document.getElementById('logoWrap');
  if(tpl && wrap) wrap.appendChild(tpl.content.cloneNode(true));
})();
document.getElementById('mobBtn').addEventListener('click', function(){
  const m = document.getElementById('mobMenu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
});

function fmtNum(n){ return Number(n).toLocaleString('fr-FR'); }

function hexLife(state){
  const id = state === 'full' ? 'hx-full' : state === 'empty' ? 'hx-empty' : 'hx-dead';
  const color = state === 'full' ? '#F5F4F0' : state === 'dead' ? 'rgba(245,244,240,.25)' : 'rgba(245,244,240,.5)';
  return `<svg class="life-hex" style="color:${color};"><use href="#${id}"/></svg>`;
}

function livesRow(lives){
  const states = [];
  for(let i = 0; i < 3; i++){
    states.push(i < lives ? 'full' : (i < 3 ? (lives === 0 ? 'dead' : 'empty') : 'empty'));
  }
  // Simplify: full for i<lives, dead if lives===0, empty otherwise
  const s = [
    lives >= 1 ? 'full' : 'dead',
    lives >= 2 ? 'full' : (lives === 0 ? 'dead' : 'empty'),
    lives >= 3 ? 'full' : (lives === 0 ? 'dead' : 'empty'),
  ];
  return `<div class="lives-row">${s.map(hexLife).join('')}<span style="font-family:var(--fm);font-size:13px;opacity:.6;margin-left:8px;">${lives}/3 vies</span></div>`;
}

async function render(){
  let me;
  try {
    me = await CantaleAPI.myProfile();
  } catch(e){
    if(e.status === 401){ window.location.href = 'login.html'; return; }
    document.getElementById('page-content').innerHTML =
      `<div class="loading" style="color:#c00;">Erreur : ${e.message}</div>`;
    return;
  }

  const avatarUrl = `https://mc-heads.net/avatar/${encodeURIComponent(me.username)}/128`;
  const rankLabel = me.rank === 'NONE' ? 'Membre' : me.rank;
  const kd = me.deaths > 0 ? (me.kills / me.deaths).toFixed(2) : me.kills;

  /* FACTION */
  const factionBlock = me.faction ? `
    <div class="faction-card">
      <div class="faction-tag-cell"><div class="faction-tag-txt">[${me.faction.tag}]</div></div>
      <div class="faction-info">
        <div class="faction-name">${me.faction.name}</div>
        <div class="faction-meta">Type : ${me.faction.type} · Mon rang : <strong>${me.faction.memberRank}</strong></div>
      </div>
      <div class="faction-link">
        <a href="factions.html?tag=${encodeURIComponent(me.faction.tag)}">Voir la faction →</a>
      </div>
    </div>
  ` : `
    <div class="faction-empty">
      <span>Aucune faction.</span>
      <span>Crée la tienne : <code>/f create &lt;nom&gt;</code> ou attends une invitation.</span>
    </div>
  `;

  /* VOTES */
  const votesBlock = me.voteStats ? `
    <div class="votes-card">
      <div class="vote-cell">
        <div class="vote-val">${fmtNum(me.voteStats.total)}</div>
        <div class="vote-lbl">Total votes</div>
      </div>
      <div class="vote-cell">
        <div class="vote-val">${me.voteStats.streak}<span style="font-size:.5em;opacity:.5;">j</span></div>
        <div class="vote-lbl">Streak actuel</div>
      </div>
      <div class="vote-cell">
        <div class="vote-val" style="font-family:var(--fm);font-size:clamp(14px,1.8vw,20px);line-height:1.2;">${me.voteStats.lastVoteAt ? new Date(me.voteStats.lastVoteAt*1000).toLocaleDateString('fr-FR') : '—'}</div>
        <div class="vote-lbl">Dernier vote</div>
      </div>
    </div>
  ` : '';

  document.getElementById('page-content').innerHTML = `
    <!-- HERO -->
    <div class="profile-hero">
      <div class="profile-hero-inner">
        <div class="avatar-cell">
          <img class="avatar-img" src="${avatarUrl}" alt="${me.username}">
          <div class="avatar-rank rank-${me.rank}">${rankLabel}</div>
        </div>
        <div class="profile-info">
          <div class="profile-kicker">Profil Cantale</div>
          <div class="profile-name">${me.username}</div>
          ${livesRow(me.lives)}
        </div>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-cell">
          <div class="stat-val">${me.lives}</div>
          <div class="stat-lbl">Vies</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" style="font-size:clamp(16px,2.2vw,28px);">${fmtNum(Math.floor(me.balance))}</div>
          <div class="stat-lbl">Cantox</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val">${fmtNum(me.kills)}</div>
          <div class="stat-lbl">Kills</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val">${fmtNum(me.deaths)}</div>
          <div class="stat-lbl">Morts</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val">${fmtNum(me.kill_streak)}</div>
          <div class="stat-lbl">Streak</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val">${kd}</div>
          <div class="stat-lbl">K / D</div>
        </div>
      </div>
    </div>

    <!-- BODY -->
    <div class="profile-body">
      <div class="w">

        <div class="psec">
          <div class="psec-title">Ma Faction</div>
          ${factionBlock}
        </div>

        ${me.voteStats ? `
        <div class="psec">
          <div class="psec-title">Votes</div>
          ${votesBlock}
        </div>
        ` : ''}

        <div class="logout-row">
          <button class="logout-btn" id="btn-logout">Se déconnecter</button>
        </div>

      </div>
    </div>

    <!-- FOOTER -->
    <footer class="bot">
      <div class="w frow">
        <svg viewBox="0 0 260 32" style="height:28px;cursor:pointer;" onclick="window.location='index.html'">
          <g fill="none" stroke="#0A0A0A" stroke-width="3.5"><polygon points="14,2 25,8 25,24 14,30 3,24 3,8" fill="#0A0A0A"/><polygon points="38,2 49,8 49,24 38,30 27,24 27,8"/><polygon points="62,2 73,8 73,24 62,30 51,24 51,8"/><line x1="54" y1="9" x2="70" y2="23"/><line x1="70" y1="9" x2="54" y2="23"/></g>
          <text x="82" y="21" font-family="Unbounded,Anton,sans-serif" font-weight="800" font-size="16" fill="#0A0A0A" letter-spacing="-0.4">CANTALE</text>
        </svg>
        <div class="flinks">
          <a href="https://discord.gg/65a9upGPHx" target="_blank" rel="noopener">Discord</a>
          <a href="boutique.html">Boutique</a>
          <a href="palliers.html">Paliers</a>
          <a href="regles.html">Règlement</a>
        </div>
        <span class="fcopy">© 2025 Cantale · Non affilié à Mojang Studios</span>
      </div>
    </footer>
  `;

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await CantaleAPI.logout();
    window.location.href = 'index.html';
  });
}

render();
</script>
</body>
</html>
